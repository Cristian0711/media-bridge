worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    lua_package_path "/usr/local/openresty/lualib/?.lua;/etc/nginx/lua/?.lua;;";

    # Token cache: 10MB shared dict holds ~80k entries
    lua_shared_dict token_cache 10m;

    log_format json_combined escape=json
        '{'
            '"component":"nginx",'
            '"type":"access",'
            '"time":"$time_iso8601",'
            '"request_id":"$http_x_request_id",'
            '"remote_addr":"$remote_addr",'
            '"method":"$request_method",'
            '"uri":"$uri",'
            '"query":"$args",'
            '"status":$status,'
            '"body_bytes_sent":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_addr":"$upstream_addr",'
            '"upstream_status":"$upstream_status",'
            '"upstream_response_time":"$upstream_response_time",'
            '"user_agent":"$http_user_agent"'
        '}';
    access_log /dev/stdout json_combined;
    error_log /dev/stderr warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;

    upstream media_bridge_api {
        server backend:8080;
        keepalive 64;
        keepalive_requests 1000;
        keepalive_timeout 60s;
    }

    server {
        listen 80;
        resolver 127.0.0.11 valid=30s;

        root /usr/share/nginx/html;

        location /api/ {
            access_by_lua_block {
                local cjson = require "cjson.safe"
                local auth = require "auth"

                local request_id = ngx.req.get_headers()["X-Request-ID"] or ngx.var.request_id
                ngx.req.set_header("X-Request-ID", request_id)
                ngx.header["X-Request-ID"] = request_id

                local uri = ngx.var.uri
                if uri == "/api/v1/auth/login" or uri == "/api/v1/auth/register" then
                    return
                end

                local token = auth.extract_token()
                if not token then
                    ngx.status = 401
                    ngx.say(cjson.encode({ error = "Missing authentication token" }))
                    return ngx.exit(401)
                end

                local ok, data, err_status, err_body = auth.validate_token(token, request_id)
                if not ok then
                    ngx.status = err_status
                    ngx.say(cjson.encode(err_body))
                    return ngx.exit(err_status)
                end

                auth.set_user_headers(data)
            }

            proxy_pass http://media_bridge_api;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";
            proxy_http_version 1.1;
            proxy_buffering          off;
            proxy_cache              off;
            proxy_read_timeout       3600s;
            proxy_send_timeout       3600s;
            # Chunked encoding must stay enabled for SSE (events + torrent streams).
            proxy_pass_request_headers on;
        }

        # PWA manifest & icons
        location ~* ^/(manifest\.webmanifest|apple-touch-icon\.png|icon-.*\.png)$ {
            expires 7d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }

        # Hashed build assets — long cache
        location /_app/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # SPA shell — never cache (avoids stale index.html + wrong JS hashes on iOS)
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            try_files /index.html =404;
        }

        location / {
            access_by_lua_block {
                local auth = require "auth"
                local uri = ngx.var.uri

                -- Only these SPA routes require auth; /login, /register, assets are open.
                if not auth.requires_frontend_auth(uri) then
                    return
                end

                local token = auth.extract_token()
                if not token then
                    return auth.redirect_to_login(uri)
                end

                local request_id = ngx.req.get_headers()["X-Request-ID"] or ngx.var.request_id
                local ok = auth.validate_token(token, request_id)
                if not ok then
                    return auth.redirect_to_login(uri)
                end
            }

            add_header Cache-Control "no-store, no-cache, must-revalidate";
            try_files $uri $uri/ /index.html;
        }
    }
}
