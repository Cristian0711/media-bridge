services:
  postgres:
    image: postgres:16-alpine
    container_name: media-bridge-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: media-bridge-api
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Overrides / supplements .env (DATABASE_URL is built from compose vars)
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      PORT: ${PORT:-8080}
      TMDB_URL: ${TMDB_URL:-https://api.themoviedb.org/3}
      TMDB_API_KEY: ${TMDB_API_KEY}
      # --- Observability (traces) ---
      # Export OTLP/gRPC to the collector. Set OTEL_TRACES_EXPORTER=none to disable.
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-otlp}
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-otlp}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      # Head-sample everything; the collector tail-samples (keeps all errors).
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-deployment.environment=production,service.namespace=media-bridge}
      APP_VERSION: ${APP_VERSION:-dev}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /mnt/plexmedia/:/mnt/plexmedia/
    expose:
      - "${PORT:-8080}"
    networks:
      - backend-net

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: media-bridge-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - backend-net

  # ---------------- OPENTELEMETRY COLLECTOR ----------------
  # Vendor-neutral telemetry sink. Receives OTLP from the backend and routes it
  # to your trace backend (see otel/collector-config.yaml). Swap backends there
  # with no app changes.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: media-bridge-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel/collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    expose:
      - "4317" # OTLP gRPC
      - "4318" # OTLP HTTP
      - "8889" # Prometheus metrics (app_log_errors_total, etc.)
    networks:
      - backend-net

  # ---------------- CLOUDFLARE TUNNEL ----------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    command: tunnel run
    env_file:
      - .env
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - nginx
    restart: unless-stopped
    networks:
      - backend-net

  # qbittorrent runs outside this stack (or on host). Uncomment if you want it in compose.
  # qbittorrent:
  #   image: lscr.io/linuxserver/qbittorrent:latest
  #   environment:
  #     - PUID=1000
  #     - PGID=1000
  #     - WEBUI_PORT=8080
  #   ports:
  #     - 8080:8080
  #     - 6881:6881
  #     - 6881:6881/udp
  #   volumes:
  #     - /mnt/plexmedia:/mnt/plexmedia
  #   restart: unless-stopped
  #   networks:
  #     - backend-net

volumes:
  postgres_data:

networks:
  backend-net:
    name: backend-net
