services:
  postgres:
    image: postgres:16-alpine
    container_name: media-bridge-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: media-bridge-api
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Overrides / supplements .env (DATABASE_URL is built from compose vars)
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      PORT: ${PORT:-8080}
      TMDB_URL: ${TMDB_URL:-https://api.themoviedb.org/3}
      TMDB_API_KEY: ${TMDB_API_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /mnt/plexmedia/:/mnt/plexmedia/
    expose:
      - "${PORT:-8080}"
    networks:
      - backend-net

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: media-bridge-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - backend-net

  # ---------------- CLOUDFLARE TUNNEL ----------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    command: tunnel run
    env_file:
      - .env
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - nginx
    restart: unless-stopped
    networks:
      - backend-net

  # qbittorrent runs outside this stack (or on host). Uncomment if you want it in compose.
  # qbittorrent:
  #   image: lscr.io/linuxserver/qbittorrent:latest
  #   environment:
  #     - PUID=1000
  #     - PGID=1000
  #     - WEBUI_PORT=8080
  #   ports:
  #     - 8080:8080
  #     - 6881:6881
  #     - 6881:6881/udp
  #   volumes:
  #     - /mnt/plexmedia:/mnt/plexmedia
  #   restart: unless-stopped
  #   networks:
  #     - backend-net

volumes:
  postgres_data:

networks:
  backend-net:
    name: backend-net
